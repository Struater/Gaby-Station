  components:
  - type: Action
    icon: /Textures/_Dumont/Interface/Objectives/comms.png
    useDelay: 0
    checkCanInteract: false
    backgroundOn: { sprite: _RMC14/Actions/xeno_actions.rsi, state: template_on }
  - type: EntityTargetAction
    rotateOnUse: false
    whitelist:
      components:
      - CommunicationsConsole
    event: !type:XenomorphCommsHijackActionEvent
  - type: TargetAction
    range: 3.5
    checkCanAccess: false
